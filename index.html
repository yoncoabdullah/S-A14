<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Sweetheart ❤️</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    width:100%;
    min-width:0;
    font-family:Tahoma,Arial,sans-serif;
    color:#5b2338;
    background:linear-gradient(135deg,#fff5f8,#ffe6ef,#fff);
    overflow-x:hidden;
}

/* Floating hearts */

#fx{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
}

.f{
    position:absolute;
    bottom:-50px;
    animation:up linear forwards;
    opacity:.75;
}

@keyframes up{
    to{
        transform:translateY(-115vh) rotate(360deg);
        opacity:0;
    }
}

/* Sections */

section{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 15px;
    position:relative;
    z-index:1;
}

/* Cards */

.card{
    width:100%;
    max-width:900px;
    min-width:0;
    padding:30px 20px;
    border-radius:30px;
    background:#ffffffd4;
    backdrop-filter:blur(10px);
    box-shadow:0 20px 60px #78234620;
    text-align:center;
    border:1px solid #dc416e30;
}

/* Text */

h1{
    font-size:clamp(38px,10vw,82px);
    color:#d62f65;
    margin:5px 0;
}

h2{
    font-size:clamp(28px,7vw,46px);
    color:#c82d5e;
    margin:8px 0 18px;
}

p{
    font-size:clamp(16px,4vw,21px);
    line-height:2;
    margin:12px auto;
    max-width:780px;
}

/* Buttons */

button{
    border:0;
    border-radius:999px;
    padding:14px 25px;
    margin:8px 4px;
    background:#d62f65;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 24px #d62f6540;
}

.secondary{
    background:#fff;
    color:#c82d5e;
    border:1px solid #e7a1b5;
}

/* Gallery */

.gallery{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:35px;
    margin:25px 0;
}

.photo-box{
    width:100%;
    max-width:650px;
    text-align:center;
}

.photo{
    width:100%;
    aspect-ratio:4/5;
    border-radius:22px;
    overflow:hidden;
    background:#ffe0e9;
    border:1px solid #efb2c3;
    cursor:pointer;
    transition:transform .25s ease,box-shadow .25s ease;
}

.photo:hover{
    transform:scale(1.015);
    box-shadow:0 12px 30px #78234625;
}

.photo img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
}

.caption{
    margin:10px 0 0 !important;
    padding:8px 5px;
    color:#c82d5e;
    font-size:18px !important;
    font-weight:bold;
    line-height:1.7 !important;
}

/* Image Viewer */

#imageViewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(35,10,22,.92);
    align-items:center;
    justify-content:center;
    padding:25px;
}

#imageViewer.open{
    display:flex;
}

#fullImage{
    max-width:95vw;
    max-height:90vh;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:15px;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.closeViewer{
    position:absolute;
    top:15px;
    right:18px;
    width:48px;
    height:48px;
    padding:0;
    margin:0;
    border-radius:50%;
    background:#fff;
    color:#c82d5e;
    font-size:28px;
    line-height:48px;
    box-shadow:none;
    z-index:3;
}

.prevImage,
.nextImage{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    padding:0;
    margin:0;
    border-radius:50%;
    background:#fff;
    color:#c82d5e;
    font-size:25px;
    line-height:48px;
    box-shadow:none;
    z-index:3;
}

.prevImage{
    left:15px;
}

.nextImage{
    right:15px;
}

/* Letter */

.note{
    margin:22px 0;
    padding:22px;
    border-radius:22px;
    background:#fff7fa;
    border-right:5px solid #d62f65;
    text-align:right;
}

.note p{
    margin:7px 0;
}

.en{
    direction:ltr;
    text-align:left;
    font-family:Georgia,serif;
}

/* Surprise */

#surprise{
    display:none;
}

#surprise.open{
    display:block;
    animation:show .7s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* Audio */

audio{
    width:min(520px,100%);
    margin:12px auto;
}

.small{
    font-size:13px!important;
}

/* Footer */

footer{
    text-align:center;
    padding:25px;
    color:#9a6074;
    position:relative;
    z-index:1;
}

@media(max-width
